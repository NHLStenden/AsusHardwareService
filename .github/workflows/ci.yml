name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AsusHardwareService.sln

      - name: Build
        run: dotnet build AsusHardwareService.sln --configuration Release --no-restore

      # Chocolatey's Inno Setup package is intentionally pinned so CI toolchain changes are explicit.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Build publish output and installer
        shell: pwsh
        run: ./build/Build.ps1 -Installer

      - name: Upload published app
        uses: actions/upload-artifact@v7
        with:
          name: AsusHardwareService-win-x64
          path: artifacts/publish/win-x64
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: AsusHardwareService-installer
          path: |
            artifacts/installer/*.exe
            artifacts/installer/*.sha256
          if-no-files-found: error
